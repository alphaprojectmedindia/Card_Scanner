
services:
  - type: web
    name: digital-share-api
    runtime: docker
    dockerfilePath: ./backend/DigitalShare.Api/Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /health

    disk:
      name: digital-share-uploads
      mountPath: /app/uploads
      sizeGB: 1

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: DATABASE_URL
        fromDatabase:
          name: digital-share-db
          property: connectionString

      - key: Jwt__Issuer
        value: DigitalShare.Api

      - key: Jwt__Audience
        value: DigitalShare.MobileApp

      - key: Jwt__SecretKey
        generateValue: true

      - key: Jwt__ExpiryMinutes
        value: "60"

      - key: Jwt__RefreshTokenExpiryDays
        value: "30"

      # Gemini configuration
      - key: Gemini__ApiKey
        sync: false

      - key: Gemini__ModelId
        value: gemini-3.8-flash

      - key: Gemini__FallbackModelId
        value: gemini-3.5-flash-lite

      - key: Gemini__Enabled
        value: "true"

      - key: Gemini__TimeoutSeconds
        value: "8"

      - key: Gemini__MaxRetries
        value: "2"

      # Local persistent storage
      - key: Storage__Provider
        value: Local

      - key: Storage__Local__Directory
        value: /app/uploads/temp-scans

      - key: Storage__Local__MaxFileSizeMb
        value: "20"

databases:
  - name: digital-share-db
    databaseName: digital_share_db
    user: digital_share_user
    region: singapore
    plan: 0.5c-1g
    postgresMajorVersion: "16"
